version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: seopilot_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./scripts/backup_db.sh:/etc/periodic/daily/backup_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - seopilot_internal

  redis:
    image: redis:7-alpine
    container_name: seopilot_redis_prod
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - seopilot_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seopilot_backend_prod
    restart: always
    environment:
      - ENVIRONMENT=production
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_HOST=redis
      - SECRET_KEY=${SECRET_KEY}
      - STRIPE_API_KEY=${STRIPE_API_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - seopilot_internal

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seopilot_celery_worker_prod
    command: celery -A app.core.celery_app worker --loglevel=warning -c 4
    restart: always
    environment:
      - ENVIRONMENT=production
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - backend
      - redis
    networks:
      - seopilot_internal

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seopilot_celery_beat_prod
    command: celery -A app.core.celery_app beat --loglevel=warning
    restart: always
    environment:
      - ENVIRONMENT=production
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
    depends_on:
      - celery_worker
    networks:
      - seopilot_internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: seopilot_frontend_prod
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    networks:
      - seopilot_internal

  nginx:
    image: nginx:1.25-alpine
    container_name: seopilot_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - seopilot_internal

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: seopilot_prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - seopilot_internal

networks:
  seopilot_internal:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  prometheus_data:
